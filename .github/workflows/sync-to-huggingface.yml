name: Sync to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true

      - uses: huggingface/hub-sync@v0.1.0
        with:
          github_repo_id: MCP4RemoteSensing/mcp4rs-open-earth
          huggingface_repo_id: zlysunshine/mcp4rs-open-earth
          repo_type: space
          space_sdk: gradio
          hf_token: ${{ secrets.HF_TOKEN }}